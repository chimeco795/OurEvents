<div class="store-context"><strong>Gestionando: {{ proveedor.nombre }}</strong>{% if tiendas_contexto|length > 1 %}<label for="tienda-contexto">Cambiar tienda</label><select id="tienda-contexto" data-store-selector>{% for tienda in tiendas_contexto %}<option value="{% url 'gestion_dashboard' tienda.pk %}" {% if tienda.pk == proveedor.pk %}selected{% endif %}>{{ tienda.nombre }}</option>{% endfor %}</select>{% endif %}</div>
<nav class="dashboard-nav" aria-label="Gestión del negocio"><a href="{% url 'gestion_dashboard' proveedor.pk %}">Dashboard</a><a href="{% url 'gestion_productos' proveedor.pk %}">Productos</a><a href="{% url 'gestion_inventario' proveedor.pk %}">Inventario</a><a href="{% url 'gestion_ordenes' proveedor.pk %}">Órdenes</a><a href="{% url 'gestion_opiniones' proveedor.pk %}">Opiniones</a><a href="{% url 'gestion_negocio' proveedor.pk %}">Mi tienda</a><a href="{% url 'gestion_membresia' proveedor.pk %}">Membresía</a><a href="{% url 'gestion_equipo' proveedor.pk %}">Equipo</a></nav>
