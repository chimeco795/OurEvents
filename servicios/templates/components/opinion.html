<article class="review"><strong>{{ opinion.usuario.username }}</strong> <span class="stars">{{ opinion.estrellas }} / 5 ★</span>{% if opinion.compra_verificada %} <span class="badge">Compra verificada</span>{% endif %}<p>{{ opinion.comentario }}</p><small class="muted">{{ opinion.fecha|date:'d M Y' }}</small>{% if opinion.respuesta %}<div class="reply"><strong>Respuesta del negocio</strong><p>{{ opinion.respuesta }}</p></div>{% endif %}<p><a class="muted" href="{% url 'reportar_contenido' opinion.tipo_reporte opinion.pk %}">Reportar opinión</a></p></article>
